
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "banksight-ai"
version = "0.1.0"
description = "A banking risk and customer intelligence platform."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = []


[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.9",
]
ml = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.12",
    "scikit-learn>=1.5",
    "joblib>=1.4",
]
database = [
    "SQLAlchemy>=2.0",
    "psycopg[binary]>=3.2",
]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]
dashboard = [
    "streamlit>=1.40",
    "plotly>=5.24",
]
monitoring = [
    "mlflow>=2.18",
]
distributed = [
    "pyspark>=3.5",
]


[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
